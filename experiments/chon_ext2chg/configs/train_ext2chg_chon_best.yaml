# Recommended settings from 12-arm screening and two-seed, 100-epoch confirmation.
# The experimental runner preserves the 303/88/41 split; the general CLI uses its own split.
task:
  type: ext2chg
  name: chon_ext2chg_best
data:
  data_paths:
  - ./data/CHON
  cache: ./data/cache/chon
  potcar_dir: /Users/leseixas/Simulations/vasp/POTCARs
  strict_potcar: true
  atomic_reference: ./data/CHON/isolated_atoms
  delta_density: true
  resolution: 24
  storage: hdf5
  cache_in_memory: true
model:
  use_coordinates: false
  mode_selection: physical
  g_max: 12
  equivariant:
    enable: true
    n_radial: 8
    g_basis: auto
    spherical_cutoff: true
  paw:
    enable: true
    width: 16
    modes: 6
    n_layers: 3
    readout_g_max: 2.239576570351994
    occupancy_weight: 3
    neighbor_min: 0.6
training:
  epochs: 100
  learning_rate: 0.003
  eval_epoch: 5
  early_stopping: 100
  init_seed: 1
  device: cpu
