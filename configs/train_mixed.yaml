# =====================================================================
# Poraque - one operator from several datasets at once
#
#   poraque-train --config configs/train_mixed.yaml
#
# configs/train.yaml is the reference run; this file states only what pooling
# two layouts changes. See configs/train_complete_and_commented.yaml for every
# key, annotated.
# =====================================================================

task:
  type: ext2chg                 # a bulk CHGCAR archive carries no tau, so chg2tau has half a set
  name: mixed_ext2chg           # names models/<name>/ and everything inside it

data:
  data_paths:                   # ONE key, ONE shape. Every entry is a directory of
                                #   per-material subdirectories; where it came from is
                                #   not stated because nothing needs to know.
    - data/vasp/structures      # structure_0000/, ... : inputs beside the density, so
                                #   V_ext is built from their own POTCARs
    - data/MP                   # mp-124/, ... : a density and no inputs, so V_ext is
                                #   built from the density's own header -- exactly with
                                #   `potcar_dir` below, Gaussian without it
                                # CAVEAT: those are two DEFINITIONS of V_ext, ~0.1 relative L2
                                #   apart unless `potcar_dir` covers both. A legitimate trade,
                                #   never a good accident; the run warns when it happens.
  cache: data/cache/mixed       # its own cache: the fingerprint would refuse to share one

model:
  width: 16                     # channels carried through the Fourier layers
  modes: 8                      # retained Fourier modes per axis
  n_layers: 3                   # Fourier layers
  projection_channels: 64       # hidden width of the read-out head
  mode_selection: fixed         # switch to `physical` + g_max if the pooled cells spread widely
  activation: silu              # stateless; `kan` moves the hyperparameters into kan_setup

training:
  epochs: 200                   # this set is large, so an epoch is expensive
  early_stopping: 50            # and the patience can be tighter
  physics_informed_setup:
    electron_count_weight: 0.1  # int(rho) = the known valence count
    positivity_weight: 0.0
    von_weizsacker_weight: 0.0
    euler_lagrange_weight: 0.0
