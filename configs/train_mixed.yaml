# =====================================================================
# Poraque - one operator from several datasets at once
#
#   poraque-train --config configs/train_mixed.yaml
#
# Every key is optional; only the differences from the defaults are listed.
# See configs/train_complete_and_commented.yaml for the model settings explained in full.
# =====================================================================
task:
  # ext2chg only: a bulk CHGCAR archive carries no kinetic energy density, so
  # mixing one in leaves chg2tau with targets for part of the set and none
  # for the rest.
  type: ext2chg
  # Everything this run writes goes in models/mixed_ext2chg/ -- weights, log,
  # plots and report together. There is nothing else to name.
  name: mixed_ext2chg

data:
  # Several roots, pooled into one training set. Each is auto-detected, so a
  # directory of local VASP runs and an archive of standalone CHGCARs can be
  # listed side by side.
  #
  # CAVEAT, and it is a real one: these two supply *different definitions* of
  # the external potential. A calculation directory carries its POTCAR, so
  # V_ext comes from the tabulated local pseudopotential; a bulk CHGCAR
  # archive has none, so unless `potcar_dir` covers it the Gaussian pseudo-ion
  # model stands in -- roughly 0.1 relative L2 away. The run warns when it
  # happens. It is a legitimate trade (far more data, a fuzzier input) but
  # never a good accident.
  train_paths:
    - data/vasp
    - data/MP/chgcar
  cache: data/cache/mixed

training:
  # Shorter than the default: this set is large, so an epoch is expensive and
  # the early-stopping window can be tighter.
  epochs: 200
  early_stopping: 50
