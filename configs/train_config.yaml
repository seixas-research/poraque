# =====================================================================
# Poraque - Fourier Neural Operator training configuration
#
#   poraque-train --config configs/train_config.yaml
#
# Command-line flags override these values, so one committed config can
# be swept from the shell without editing it:
#
#   poraque-train --config configs/train_config.yaml --epochs 500
#
# Equivalent, from a checkout with nothing installed:
#
#   python scripts/poraque_train.py --config configs/train_config.yaml
# =====================================================================
task:
  # all | ext2chg | chg2tau. `task: all` on its own -- without this block --
  # is still accepted and means the same thing.
  type: all
  # Names every artefact the run writes:
  #
  #   models/<name>.pfno            the weights
  #   reports/<name>_report.pdf     the PDF report
  #   results/plots/<name>/         the figures
  #
  # Change it for a run worth keeping beside the last one; two runs sharing a
  # name share their output files, and the second wins.
  name: poraque_models
data:
  # One dataset directory. For several -- which may mix layouts, e.g. local
  # runs beside an archive of standalone CHGCARs -- use `train_paths`:
  #
  #   train_paths:
  #     - data/vasp
  #     - data/MP/chgcar
  #
  # See configs/train_mixed_config.yaml, and mind the caveat there about
  # mixing two definitions of V_ext.
  train_paths: null
  root: data/vasp
  # Layout of each path: auto | vasp | bulk | prepared.
  source: auto
  cache: data/cache
  pattern: struct
  code: auto
  resolution: 32
  # POTCAR library, used only where the data itself ships none -- an archive
  # of standalone CHGCARs, or a run whose POTCAR was stripped. With it V_ext
  # is VASP's tabulated potential; without it, the Gaussian pseudo-ion model.
  potcar_dir: null
  # Gaussian pseudo-ion width in Angstrom, reached only where no tabulated
  # potential is available; null derives it per species from the POTCAR core
  # radius, which is right wherever a POTCAR exists.
  sigma: null
  gaussian_blur: null
  blur_method: spectral
model:
  width: 16
  modes: 8
  n_layers: 4
  projection_channels: 48
  activation: gelu
  use_coordinates: true
  cell_conditioning: true
  embedding_dim: 32
  mode_selection: fixed
  g_max: null
  pauli_residual: false
  pauli_scale: null
  learn_pauli_scale: true
training:
  epochs: 300
  batch_size: 4
  learning_rate: 0.002
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
  valid_fraction: 0.2
  enable_kfold: false
  k_folds: 5
  eval_epoch: 10
  early_stopping: 100
  seed: 42
  init_seed: null
  device: auto
  loss: relative_l2
  sobolev_weight: 0.1
  # Physics-informed terms, added to the data loss as
  #
  #   total = data + sum_i weight_i * term_i
  #
  # and reported as separate `data loss` / `physics loss` / `total loss`
  # columns during training, because a falling total says nothing about which
  # half fell. Introduce them one at a time against a measured baseline: a
  # badly scaled constraint degrades accuracy while looking principled.
  physics:
    # CHARGE CONSERVATION (ext2chg). Squared relative error between the
    # integral of the predicted density and the integral of the reference --
    # the valence electron count. One reduction per batch, and it pins the one
    # global degree of freedom a pointwise loss controls worst: a relative L2
    # is indifferent to a percent of charge spread thinly over the cell, and a
    # total energy is not. 0.1 keeps it an order of magnitude below the data
    # term, which is the intended balance. Set 0.0 for the supervised
    # baseline.
    electron_count_weight: 0.1
    positivity_weight: 0.0
    von_weizsacker_weight: 0.0
    euler_lagrange_weight: 0.0
output:
  log: logs/fno_training.log
  json: logs/fno_training.json
  checkpoint_dir: models
  plot_dir: results/plots
  report_dir: reports
  plot_format: png
  dpi: 200
symbolic:
  enable_symbolic_distillation: false
  target: model
  features: gga
  template: none
  epsilon: 1.0e-08
  constraints:
    ^:
    - -1
    - 1
  unary_operations:
  - exp
  - log
  - sqrt
  - abs
  binary_operations:
  - +
  - '-'
  - '*'
  - /
  - ^
  iterations: 40
  population_size: 33
  populations: 15
  max_depth: 10
  max_size: 30
  parsimony: 0.0032
  n_samples: 4000
  seed: 0
fine_tuning:
  enable: false
  pretrained_checkpoint: models/poraque_models.pfno
  learning_rate: 1.0e-05
  freeze_lifting_layers: false
