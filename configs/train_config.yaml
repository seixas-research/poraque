# =====================================================================
# Poraque - Fourier Neural Operator training configuration
#
#   poraque-train --config configs/train_config.yaml
#
# Command-line flags override these values, so one committed config can
# be swept from the shell without editing it:
#
#   poraque-train --config configs/train_config.yaml --epochs 500
#
# Equivalent, from a checkout with nothing installed:
#
#   python scripts/poraque_train.py --config configs/train_config.yaml
# =====================================================================
task:
  # all | ext2chg | chg2tau. `task: all` on its own -- without this block --
  # is still accepted and means the same thing.
  type: all
  # Names every artefact the run writes:
  #
  #   models/<name>.pfno            the weights
  #   reports/<name>_report.pdf     the PDF report
  #   results/plots/<name>/         the figures
  #
  # Change it for a run worth keeping beside the last one; two runs sharing a
  # name share their output files, and the second wins.
  name: au_w16_m8_l3_p0.1
data:
  # One dataset directory. For several -- which may mix layouts, e.g. local
  # runs beside an archive of standalone CHGCARs -- use `train_paths`:
  #
  #   train_paths:
  #     - data/vasp
  #     - data/MP/chgcar
  #
  # See configs/train_mixed_config.yaml, and mind the caveat there about
  # mixing two definitions of V_ext.
  train_paths: null
  root: data/vasp
  # Layout of each path: auto | vasp | bulk | prepared.
  source: auto
  cache: data/cache
  pattern: struct
  code: auto
  resolution: 32
  potcar_dir: /Users/leseixas/Simulations/vasp/POTCARs
  sigma: null
  gaussian_blur: null
  blur_method: spectral
model:
  width: 16
  modes: 12
  n_layers: 3
  projection_channels: 64
  activation: gelu
  use_coordinates: true
  cell_conditioning: true
  embedding_dim: 32
  mode_selection: fixed
  g_max: null
  pauli_residual: false
  pauli_scale: null
  learn_pauli_scale: true
training:
  epochs: 500
  batch_size: 4
  learning_rate: 0.002
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
  valid_fraction: 0.2
  enable_kfold: false
  k_folds: 5
  eval_epoch: 10
  early_stopping: 300
  seed: 42
  init_seed: null
  device: auto
  loss: relative_l2
  sobolev_weight: 0.1
  # Physics-informed terms, added to the data loss as
  #
  #   total = data + sum_i weight_i * term_i
  #
  # and reported as separate `data loss` / `physics loss` / `total loss`
  # columns during training, because a falling total says nothing about which
  # half fell. Introduce them one at a time against a measured baseline: a
  # badly scaled constraint degrades accuracy while looking principled.
  physics:
    electron_count_weight: 0.1
    positivity_weight: 0.0
    von_weizsacker_weight: 0.0
    euler_lagrange_weight: 0.0
output:
  log: logs/fno_training.log
  json: logs/fno_training.json
  checkpoint_dir: models
  plot_dir: results/plots
  report_dir: reports
  plot_format: png
  dpi: 200
symbolic:
  enable_symbolic_distillation: true
  target: model
  # THE PAULI ENHANCEMENT FACTOR, on the two reduced variables and nothing
  # else. `features` picks the inputs, `template` picks how the target is
  # factorised, and these two together define the search as
  #
  #   F(p, q) = (tau - tau_vW) / tau_TF,     tau = tau_vW + tau_TF * F(p, q)
  #
  # so the formula found *is* the kinetic energy density, reconstructed from
  # two terms already known in closed form:
  #
  #   tau_vW = |grad rho|^2 / (8 rho)        tau_TF = C_TF rho^(5/3)
  #
  # p = |grad rho| / (2 k_F rho) and q = lap rho / (4 k_F^2 rho) are
  # dimensionless and invariant under the coordinate scaling that fixes T_s,
  # so a functional written in them holds at every density scale rather than
  # having to be rediscovered at each. That invariance is also why rho itself
  # is *dropped*: F cannot depend on it, and offering it as a third variable
  # only gives the search a way to fit the dataset's particular densities.
  #
  # `pauli` rather than `thomas_fermi` because tau - tau_vW >= 0 by
  # Hoffmann-Ostenhof and is exactly the part a kinetic functional has to
  # model. Leaving tau_vW in the target means fitting a quantity that is
  # mostly already known, and near the vW limit it means fitting a
  # near-cancellation between two large numbers.
  #
  # Every constant to be found is then order unity, and the two limits the
  # run checks are statements about F alone: F -> 1 as (p, q) -> 0
  # (Thomas-Fermi, the uniform gas) and F -> 0 as p -> infinity (von
  # Weizsacker, one orbital).
  features: reduced
  template: pauli
  epsilon: 1.0e-08
  constraints:
    ^:
    - -1
    - 1
  # THE PHYSICS AS FITNESS, not as a filter applied afterwards.
  #
  # Checking the front once the run is over only measures how few candidates
  # were physical; by then the populations have already spent their budget
  # converging on forms that have to be discarded. With this on, the engine's
  # objective becomes
  #
  #   L = MSE  +  w+ * mean(min(F, 0)^2)                      [positivity]
  #            +  w_TF * |F(0, 0) - 1|                        [uniform gas]
  #            +  w_vW * |F(p_infinity, 0) - 0|               [one orbital]
  #
  # The first term is evaluated on the batch; the other two on synthetic probe
  # points, which is why this has to be PySR's *full objective* rather than an
  # elementwise loss --- an elementwise loss sees only (prediction, target)
  # pairs and can never evaluate a candidate where the data does not sit.
  #
  # Under `features: reduced` with `template: pauli` all three apply. Under
  # `template: none` the fitted quantity is tau rather than an enhancement
  # factor, so only positivity does; the run says which it enforced.
  #
  # NOTE: the `loss` column of the reported front is then this *constrained*
  # objective and is not comparable with an unconstrained run's. R2 and the
  # relative L2 are computed from the expression itself and are unaffected.
  physics_constraints: true
  data_loss: mse
  positivity_weight: 100.0
  thomas_fermi_weight: 100.0
  von_weizsacker_weight: 100.0
  # Large enough that no smooth interpolating form is still in its crossover
  # region, small enough that p^(8/3) stays far inside the 32-bit float the
  # engine searches in.
  p_infinity: 1.0e+06
  unary_operations:
  - exp
  - log
  - sqrt
  - abs
  binary_operations:
  - +
  - '-'
  - '*'
  - /
  - ^
  iterations: 40
  population_size: 33
  populations: 15
  max_depth: 10
  max_size: 30
  parsimony: 0.0032
  n_samples: 4000
  seed: 0
fine_tuning:
  enable: false
  pretrained_checkpoint: models/poraque_models.pfno
  learning_rate: 1.0e-05
  freeze_lifting_layers: false
