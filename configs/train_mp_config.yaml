# =====================================================================
# Poraque - training on a Materials Project charge-density download
#
#   poraque-train --config configs/train_mp_config.yaml
#
# Every key is optional; only the differences from the defaults are listed.
# See configs/train_config.yaml for the model settings explained in full, and
# `poraque-train --write-config /tmp/all.yaml` for every setting there is.
#
# This file differs from train_config.yaml only where the *data* forces it:
# the task, the mode selection and the resolution. Everything the two runs
# agree on -- width, layers, read-out width, epochs, seed, the physics
# weights -- is the shared default and is not restated here.
# =====================================================================
task:
  # ext2chg, not `all`: MP publishes densities but no kinetic energy density,
  # so chg2tau has no target to train against on this dataset. A model from
  # here predicts rho and stops there; it cannot reach a total energy on its
  # own.
  type: ext2chg
  name: mp_ag_au_pt

data:
  train_paths:
    - data/MP/Ag-Au-Pt
  # Coarser than the raw grids but finer than the default, because this set
  # spans large cells and the spectral downsample is exact for band-limited
  # fields -- there is no interpolation error to trade against.
  resolution: 40
  # Essential for this dataset, not optional. An MP download is a structure
  # and a density and no pseudopotentials, so without a library the external
  # potential falls back to the Gaussian pseudo-ion model. Point it at the set
  # the data was computed with -- MP uses VASP PBE (PAW_PBE); PAW_LDA would
  # build a potential these densities were never computed from, which is worse
  # than the Gaussian fallback because it looks exact.
  potcar_dir: /Users/leseixas/Simulations/vasp/POTCARs

model:
  # Truncate at a fixed physical wavevector rather than a fixed mode index.
  # This is the one architectural difference from train_config.yaml, and the
  # dataset is the reason: it spans a wide range of cell sizes, and a fixed
  # index keeps a different physical band for every one of them. A fixed
  # G_max makes the operator act on the same physics in every material.
  #
  # `modes` is still the ceiling -- G_max only ever selects fewer.
  mode_selection: physical
  g_max: 6

training:
  # See train_config.yaml: these constrain the NEURAL OPERATOR, not the
  # symbolic search.
  physics:
    electron_count_weight: 0.1
    positivity_weight: 0.0
    von_weizsacker_weight: 0.0
    euler_lagrange_weight: 0.0
