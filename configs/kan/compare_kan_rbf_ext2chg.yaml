# Controlled comparison: activation: kan, variant rbf.
# fixed Gaussian radial basis functions -- "FastKAN", the same fixed-grid
# design as bspline with no Cox-de Boor recursion.
#
# Against the shipped silu model (models/pt_w16_m8_l3), ext2chg only.
# Identical to configs/train.yaml except `task.type` -- ext2chg isolates the
# comparison and skips symbolic distillation, which is chg2tau-only anyway --
# and the activation. Everything else is left at the same defaults train.yaml
# itself relies on, so this is one protocol with exactly one thing changed.
#
# task.name keeps the pre-rename spelling `pt_w16_m8_l3_rbf`, so this
# config still points at the models/pt_w16_m8_l3_rbf/ it produced.
task:
  type: ext2chg               # the density operator alone
  name: pt_w16_m8_l3_rbf

data:
  potcar_dir: /Users/leseixas/Simulations/vasp/POTCARs   # as in configs/train.yaml

model:
  width: 16                   # channels carried through the Fourier layers
  modes: 8                    # retained Fourier modes per axis
  n_layers: 3                 # Fourier layers
  projection_channels: 64     # hidden width of the read-out head
  mode_selection: fixed       # as in configs/train.yaml
  activation: kan             # the learnable family; kan_setup says which and how
  kan_setup:
    variant: rbf              # bspline | cheby | rbf | rational
    grid_size: 8              # RBF centers - 1 (the default)
    grid_range: [-2.0, 2.0]   # inputs outside it decay towards zero (the default)

training:
  physics_informed_setup:
    electron_count_weight: 0.1  # int(rho) = the known valence count
    positivity_weight: 0.0
    von_weizsacker_weight: 0.0
    euler_lagrange_weight: 0.0
