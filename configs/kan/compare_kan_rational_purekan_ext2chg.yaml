# Controlled comparison: activation: kan, variant rational, use_base: false.
# a learned rational (Pade) function whose denominator is guarded to stay
# >= 1, so it can never develop a pole.
#
# Against its base-carrying twin (compare_kan_rational_ext2chg.yaml) and the
# shipped silu model, ext2chg only. One setting differs -- see FUTURE.md's
# "Run use_base: false" follow-up.
#
# Without the base term phi_c DECAYS TO ZERO for a wide pre-activation tail:
# with these degrees the denominator already outgrows the numerator.
task:
  type: ext2chg               # the density operator alone
  name: pt_w16_m8_l3_kanrational_purekan

data:
  potcar_dir: /Users/leseixas/Simulations/vasp/POTCARs   # as in configs/train.yaml

model:
  width: 16                   # channels carried through the Fourier layers
  modes: 8                    # retained Fourier modes per axis
  n_layers: 3                 # Fourier layers
  projection_channels: 64     # hidden width of the read-out head
  mode_selection: fixed       # as in configs/train.yaml
  activation: kan             # the learnable family; kan_setup says which and how
  kan_setup:
    variant: rational         # bspline | cheby | rbf | rational
    use_base: false           # "pure" KAN: only the learned residual
    rational_num_degree: 4    # numerator power (the default)
    rational_den_degree: 4    # even denominator powers; x^8 outgrows x^4 (the default)

training:
  physics_informed_setup:
    electron_count_weight: 0.1  # int(rho) = the known valence count
    positivity_weight: 0.0
    von_weizsacker_weight: 0.0
    euler_lagrange_weight: 0.0
