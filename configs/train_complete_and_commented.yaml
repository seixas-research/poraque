# =====================================================================
# Poraque - the annotated reference configuration
#
#   poraque-train --config configs/train_complete_and_commented.yaml
#   poraque-train --config configs/train_complete_and_commented.yaml --epochs 800
#
# EVERY KEY IS OPTIONAL and every key is listed here at its default, so this
# file is the map: copy the lines a run changes. configs/train_simple.yaml is
# that short form.
#
# Two rules hold everywhere:
#
#   * An operator is trained when its section is present. `ext2chg:` and
#     `chg2tau:` are the two; leave one out and it is not trained.
#   * A feature that can be switched off is a block whose presence is the
#     switch: `false` turns it off, `true` (or the bare key) turns it on with
#     the defaults shown, a block of settings turns it on with those. There is
#     no `enable` key anywhere.
#
# Command-line flags override these values (poraque-train --help), so one
# config can be swept from the shell without editing it.
# =====================================================================

run:
  name: poraque_models          # everything goes in <output>/<name>/
  output: models                # parent directory; null writes NOTHING (no checkpoint, log or figure)
  seed: 42                      # the validation draw, the folds, the batch order and the initial weights

data:
  # ONE directory, one subdirectory per material. A material is a directory
  # with a density in it (CHGCAR, compressed or not, or fields.h5):
  #
  #     <path>/
  #         <material>/
  #             CHGCAR          required -- the density, and the grid every
  #                             other field of the material is placed on
  #             TAUCAR          optional, per material: chg2tau trains on the
  #                             materials that have one
  #             POSCAR POTCAR   optional; beside the density they make the
  #             INCAR ...       external potential exact
  #
  # A VASP run tree, a `poraque-mp` download and a cache from an earlier run
  # all have this shape, so nothing says where the data came from.
  path: data/vasp/structures
  potcar_dir: null              # POTCAR library (<dir>/Pt/POTCAR, ...) used where a material ships none.
                                #   Without one the potential is a Gaussian pseudo-ion model -- a
                                #   different field, ~0.1 relative L2 -- and the PAW records cannot be
                                #   laid out, so the occupancies cannot be trained
  atoms: data/vasp/isolated_atoms   # isolated-atom reference: atomic_reference.json, or a directory of
                                #   one-atom-in-a-box runs. The baseline rho_sup of `target: delta`, the
                                #   structure channels, and the PAW records a prediction is written with
  spin: auto                    # auto keeps the magnetization when the CHGCARs carry one;
                                #   true demands it (ISPIN = 2); false discards it
  grid:
    resolution: 32              # longest grid axis after spectral downsampling
    max_spacing: null           # Ang; refine any axis coarser than this, never past the native grid.
                                #   For long thin cells, whose short axes would otherwise be cached at a
                                #   fraction of the long axis' resolution
  cache:
    dir: data/cache             # where the downsampled copies are written, under a tag that encodes
                                #   the resolution, the potential model and the spin
    storage: text               # text: a CHGCAR-format file per field | hdf5: one chunked fields.h5
                                #   per material, 1.38x smaller at gzip and exact to 1e-16
    compression: null           # null | gzip | lzf; hdf5 only, and raises on a text cache
    in_memory: auto             # keep decoded fields and normalized samples in RAM between epochs;
                                #   auto does so under a 4 GiB estimate. Off, every epoch re-parses
                                #   every file (measured 10x slower on real data)

# ---------------------------------------------------------------------
# The density operator: V_ext -> pseudo-density + each atom's PAW
# augmentation occupancies (138 numbers per atom for PAW_PBE Pt, one set
# per density channel). Present: trained. Absent: not trained.
# ---------------------------------------------------------------------
ext2chg:
  target: delta                 # delta learns rho - rho_sup, the residual over the isolated atoms
                                #   superposed, and adds rho_sup back on output | full learns rho
  structure_input: false        # channels describing the structure, appended after V_ext:
  # structure_input:
  #   superposition: true       # rho_sup
  #   elements: auto            # one superposition per element: auto (every element of the cache),
  #                             #   a list, or []. Needs target: delta
  model:
    width: 64                   # channels carried through the Fourier layers
    layers: 4                   # Fourier blocks
    modes: 16                   # retained Fourier modes per axis, counted from the lowest; under
                                #   `band` the ceiling of what a cell may keep
    band: null                  # 1/Ang. null keeps `modes` on every axis of every cell; a number
                                #   keeps floor(band * L / 2 pi) modes on an axis of length L (at most
                                #   `modes`), so every cell retains the same band of physics. Measured
                                #   20 % better on mixed cell sizes; too small starves the model (6
                                #   lost 55 %). The run logs how many modes each cell keeps
    projection_channels: 64     # hidden width of the read-out head; pointwise, so cheap
    activation: silu            # silu | gelu | relu | tanh, in every layer and in the read-out
    cell_conditioning: 32       # width of the lattice embedding every layer is modulated by (FiLM);
                                #   false drops it
    equivariant: false          # true constrains every Fourier kernel to a function of |G| alone: the
                                #   operator then commutes with every rotation and inversion. The
                                #   retained modes become a ball and no coordinate channels are
                                #   appended, both because the property fails otherwise
    # equivariant:
    #   n_radial: 16            # radial basis functions; with `width`, the layer's whole capacity
    #   g_basis: auto           # 1/Ang the basis spans; auto reads the median band off the training
    #                           #   split (a basis wider than the band wastes 14-43 %)
    precision: float32          # float32 | float64, what the operator computes in. float64 is about
                                #   twice the time and memory, and absent on Apple's MPS
  occupancies:                  # false trains the grid alone (no POTCAR needed)
    weight: 1.0                 # the occupancy term against the field objective, in training and in
                                #   the choice of the best epoch alike
    magnetization_weight: 1.0   # the magnetization's record set within the occupancy term
    readout_band: auto          # 1/Ang read around each atom; auto = 95 % of the coarsest grid's
                                #   Nyquist over the training and validation grids
    neighbor_min: 2.2           # Ang, first of the ten radial centers of the neighbor expansion;
                                #   0.6 also covers short CHON bonds

# ---------------------------------------------------------------------
# The kinetic operator: pseudo-density + every atom's occupancies -> tau.
# Trains on the materials that carry a TAUCAR.
# ---------------------------------------------------------------------
chg2tau:
  head: plain                   # plain predicts tau | pauli predicts tau_vW[rho] + s * softplus(f),
                                #   which makes tau >= tau_vW structural, with s fitted on the training
                                #   split and learned. pauli needs occupancies: false for now
  model:
    width: 16
    layers: 3
    modes: 8
    band: null
    projection_channels: 64
    activation: silu
    cell_conditioning: 32
    equivariant: false
    precision: float32
  occupancies:                  # false trains on the grid alone
    channels: 8                 # field channels each atom's records are written into, by one learned
                                #   map per element and angular momentum

training:
  epochs: 500                   # passes over the training set
  batch_size: 4                 # structures per batch, within one grid-shape bucket (shapes are never
                                #   padded into an FFT)
  samples_per_step: 0           # > 0: accumulate batches to this many structures per optimizer step, so
                                #   every structure weighs the same whatever its bucket
  optimizer:                    # on a cosine schedule, the gradient norm clipped at 1
    name: adamw                 # adamw | adam | sgd
    learning_rate: 2.0e-3
    weight_decay: 1.0e-4
  loss:
    norm: relative_l2           # absolute_l2 | relative_l2 | absolute_h1 | relative_h1. relative
                                #   normalizes per sample; h1 adds the same error on the gradients
    sobolev_weight: 0.1         # the gradient term's weight; read by the h1 norms only
  spin:                         # read only for a two-channel (rho, m) target
    mode: joint                 # joint divides both channels by the norm of (rho, m) | per_channel
                                #   divides each by its own. Measured: per_channel collapses m when the
                                #   magnetic cells are a minority (12 in 112); joint learns it
    magnetization_weight: 1.0   # per_channel only
    magnetization_floor: 0.01   # per_channel only: floor on m's denominator, as a fraction of |rho|
  validation:
    fraction: 0.2               # held out at the STRUCTURE level; 0 trains on everything
    every: 10                   # evaluate and log every this many epochs
    patience: 300               # epochs without improvement before stopping and restoring the best
                                #   weights; 0 never stops
    kfold: null                 # K: cross-validate over K folds instead of one split (K models, no
                                #   checkpoint). Not for the occupancy tasks yet
  physics:                      # penalties on the predicted fields, weighted against the data term;
                                #   all zero switches them off. Introduce one at a time against a
                                #   measured baseline: a badly scaled one degrades accuracy
    electron_count: 0.0         # ext2chg: int(rho) = N (inference renormalizes exactly anyway)
    positivity: 0.0             # rho, tau >= 0
    von_weizsacker: 0.0         # chg2tau: tau >= |grad rho|^2 / (8 rho), a theorem, one-sided

fine_tuning: false              # start from a trained checkpoint instead of a fresh initialization;
                                #   the normalizations come from it and are never refitted
# fine_tuning:
#   checkpoint: models/poraque_models/poraque_models.poraque
#   learning_rate: 1.0e-5       # much lower than a fresh fit, which is the point
#   freeze_lifting: false       # hold the input embedding fixed and adapt the rest
#   lora: false                 # freeze every weight and learn rank-r adapters on the lifting and
#                               #   projection layers (1320 trainable parameters of 3.15 M):
#   lora:
#     rank: 8
#     alpha: 16.0               # the update is scaled by alpha / rank
#     dropout: 0.0

runtime:                        # the hardware: how fast a run is, never what it computes
  device: auto                  # auto (CUDA, then MPS, then CPU) | cuda | cuda:1 | mps | cpu
  strict_device: false          # abort instead of falling back to the CPU; set it in every batch job
  distributed: auto             # auto forms a DDP group when Slurm or torchrun describes one | off
  workers: auto                 # processes that BUILD the cache, one material each: auto | n | 0.
                                #   The build is a Python text codec, so this is the setting that
                                #   uses the cores (measured 4.0x on eight)
  loader_workers: 0             # DataLoader processes; prefer cache.in_memory, which beats them
  tf32: true                    # TensorFloat-32 matmul and convolution on Ampere and later
  readout_cache_mib: 1024       # device memory for ext2chg's readout kernels, one per cell and grid

report:
  figures: true                 # plots/: loss curves, parity over every structure, field slices
  pdf: true                     # report/: the LaTeX report; needs a LaTeX toolchain
  format: png
  dpi: 200
  raw_data: false               # write the numbers behind every figure beside it (CSV, npz), so a
                                #   plot can be redrawn for publication without re-running the model
