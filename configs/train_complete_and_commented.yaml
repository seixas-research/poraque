# =====================================================================
# Poraque - the annotated reference configuration
#
#   poraque-train --config configs/train_complete_and_commented.yaml
#   poraque-train --config configs/train_complete_and_commented.yaml --epochs 800
#
# EVERY KEY IS OPTIONAL and every key is listed here at its default, so this
# file is the map: copy the two or three lines a run actually changes.
# configs/train.yaml is that short form and is the reference run.
#
# Command-line flags override these values, so one committed config can be
# swept from the shell without editing it.
# =====================================================================

task:
  type: all                     # all | ext2chg | chg2tau; only `all` reaches a total energy
  name: pt_w16_m8_l3            # names models/<name>/ and everything inside it

data:
  train_paths: null             # list of dataset dirs, layouts may be mixed; null uses `root`
  root: data/vasp/structures    # single dataset dir; runs are found here or one level below
  source: auto                  # auto | vasp | bulk | prepared (one name, or one per path)
  cache: data/cache             # where the downsampled copies are written
  pattern: structure            # prefix of run folders inside a `vasp` path
  code: auto                    # DFT code name, or auto
  resolution: 32                # longest grid axis after spectral downsampling
  potcar_dir: null              # POTCAR library; without one V_ext falls back to the Gaussian model
  sigma: null                   # Gaussian pseudo-ion width in Ang; null derives it per species
  gaussian_blur: null           # blur width in Ang for the computed potential
  blur_method: spectral         # spectral | ndimage
  spin: auto                    # auto reads the sources; true demands ISPIN=2, false discards it
  precision: float64            # how the fields are held in memory (not what the model computes in)
  xc: auto                      # pbe | lda | pw91 | auto; read by the EL analysis, not by training
  delta_density: true           # ext2chg learns rho - rho_sup; predict() still returns the full rho
  atomic_reference: data/vasp/isolated_atoms   # atomic_reference.json, or a dir of one-atom runs
  paw_source: atomic            # atomic (free atom, transferable) | material (training-set average)
  storage: files                # files (a CHGCAR-format text file per field) | hdf5 (one fields.h5)
  compression: null             # null | gzip | lzf; hdf5 only, and raises on a text cache
  compression_level: 4          # gzip only; ignored by lzf

model:
  # width is how much information travels through, modes is how far it travels
  # in space, projection_channels is only how it is read out. Spectral weights
  # go as width^2 * modes^3 and are ~99.8% of the parameters.
  width: 16                     # channels carried through the Fourier layers
  modes: 8                      # retained Fourier modes per axis, counted from the lowest
  n_layers: 3                   # how many times the lift/spectral/project cycle runs
  projection_channels: 64       # hidden width of the read-out head; pointwise, so cheap

  mode_selection: fixed         # fixed keeps `modes` per axis; physical keeps a fixed band
  g_max: null                   # cutoff in 1/Ang, required by mode_selection: physical
  # `physical` is right for a dataset spanning cell sizes; then set
  # modes = floor(g_max * L_max / 2pi) for the LARGEST cell, or the modes no
  # small cell ever reached stay at their random initialisation and go live
  # on a large one.

  activation: silu              # silu | gelu | relu | tanh (stateless) | kan (learned per channel)
  kan_setup: null               # read ONLY when activation: kan; null means the defaults below
  # kan_setup:
  #   variant: bspline          # bspline (the KAN paper) | cheby | rbf | rational
  #   use_base: true            # keep the w_c*silu(x) base term; false is a "pure" KAN
  #   grid_size: 8              # knot intervals (bspline) / RBF centers - 1 (rbf)
  #   spline_order: 3           # B-spline degree; bspline only
  #   grid_range: [-2.0, 2.0]   # support of that grid; bspline clamps outside it, rbf decays
  #   degree: 6                 # highest Chebyshev order; cheby only
  #   rational_num_degree: 4    # numerator power; rational only
  #   rational_den_degree: 4    # even denominator powers; rational only
  # Cost relative to gelu at width=16 on CPU: cheby 1.36x, rational 1.54x,
  # rbf 2.00x, bspline 5.50x. Every variant starts close to silu.

  use_coordinates: true         # append three fractional-coordinate channels to the input
  cell_conditioning: true       # condition every layer on the lattice through FiLM
  embedding_dim: 32             # width of the cell embedding FiLM reads
  precision: float32            # float32 | float64; what the operator computes in

  pauli_residual: false         # chg2tau: predict tau = tau_vW + s*softplus(f), bound by construction
  pauli_scale: null             # initial Pauli scale in eV/Ang^3; null fits it from the training split
  learn_pauli_scale: true       # optimise that scale alongside the backbone

training:
  epochs: 500                   # passes over the training set
  batch_size: 4                 # samples per batch within one grid-shape bucket
  learning_rate: 0.002
  weight_decay: 0.0001
  optimizer: adamw              # adamw | adam | sgd; identical to adam at weight_decay 0
  scheduler: cosine             # cosine | null
  grad_clip: 1.0                # global gradient-norm clip; 0 disables
  loss: relative_l2             # relative_l2 | sobolev
  sobolev_weight: 0.1           # weight of the gradient term when loss: sobolev
  valid_fraction: 0.2           # held out at the STRUCTURE level; 0 trains on everything
  eval_epoch: 10                # evaluate and log every this many epochs
  early_stopping: 300           # epochs without improvement before stopping; 0 disables
  enable_kfold: false           # cross-validate instead of fitting once; produces K models, not one
  k_folds: 5                    # folds, capped at the number of structures
  seed: 42                      # the validation draw, the fold partition, the batch order
  init_seed: null               # seeds the WEIGHTS only; null reuses `seed`
  device: auto                  # auto (CUDA, then MPS, then CPU) or an explicit backend

  # Physics-informed terms for the NEURAL OPERATOR: total = data + sum_i w_i * term_i.
  # Only the total is reported. Introduce one at a time against a measured
  # baseline -- a badly scaled constraint degrades accuracy while looking
  # principled. Not to be confused with symbolic.physics below.
  physics:
    electron_count_weight: 0.0  # ext2chg: int(rho) must equal the known valence count
    positivity_weight: 0.0      # rho, tau >= 0 (a Log head is the better fix)
    von_weizsacker_weight: 0.0  # chg2tau: tau >= |grad rho|^2 / (8 rho), a theorem, one-sided
    euler_lagrange_weight: 0.0  # ext2chg: dTs/drho + v_ext + v_H + v_xc = const, on a surrogate Ts

output:
  root: models                  # parent of every run folder; null writes NOTHING at all
  write_log: true               # log/<name>.log, .json, and the resolved config
  plot_figures: true            # render the figures into plots/
  write_pdf_report: true        # typeset the PDF into report/; needs a LaTeX toolchain
  checkpoint: true              # write the .pfno
  log: null                     # explicit log path; null uses the run folder
  json: null                    # explicit metrics path; null uses the run folder
  plot_format: png
  dpi: 200

symbolic:
  enable_symbolic_distillation: false   # minutes to hours of CPU after the fit, and needs PySR
  target: model                 # model distils what the operator learned; reference fits the DFT data
  features: gga                 # gga (rho, p, q) | reduced (p, q) | raw | enhancement (alias)
  template: none                # none fits tau directly; pauli fits F = (tau - tau_vW)/tau_TF
  # `features: reduced` with `template: pauli` is the orbital-free pairing:
  # every constant to be found is then order unity.
  epsilon: 1.0e-08              # vacuum threshold; p and q there are ratios of two noises
  constraints: {"^": [-1, 1]}   # per-operator argument complexity; the exponent is held to 1
  data_loss: mse                # mse | mae; mae is more robust on a density with wide tails
  unary_operations: [exp, log, sqrt, abs]
  binary_operations: ['+', '-', '*', /, '^']
  iterations: 40                # the single biggest quality/time knob
  population_size: 33
  populations: 15
  max_depth: 10                 # ceilings that keep the result readable rather than
  max_size: 30                  #   a fitted polynomial in disguise
  parsimony: 0.0032             # penalty per node in the fitness
  n_samples: 4000               # voxels sampled across the dataset; cost is linear in them
  seed: 0                       # seeds the sampling always, the search only under `deterministic`
  deterministic: false          # reproducible, at the cost of the parallelism across populations

  # Physics constraints on the SYMBOLIC SEARCH, as fitness rather than as a
  # filter applied afterwards. Note the `loss` column of the reported front is
  # then this constrained objective; R2 and the relative L2 are unaffected.
  physics:
    enable: true
    positivity_weight: 100.0       # F >= 0 on the batch
    thomas_fermi_weight: 100.0     # F(0, 0) = 1, the uniform gas
    von_weizsacker_weight: 100.0   # F(p_inf, 0) = 0, one orbital
    p_infinity: 1.0e+06            # stands in for p -> infinity; keeps p^(8/3) inside float32

fine_tuning:
  enable: false                 # continue a trained fit on a narrower set; normalizations come
                                #   from the checkpoint, never refitted on the new data
  pretrained_checkpoint: models/poraque_models.pfno
  learning_rate: 1.0e-05        # much lower than a fresh fit, which is the point
  freeze_lifting_layers: false  # keep the input embedding fixed and adapt only the operator
