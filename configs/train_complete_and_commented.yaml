# =====================================================================
# Poraque - the annotated reference configuration
#
#   poraque-train --config configs/train_complete_and_commented.yaml
#   poraque-train --config configs/train_complete_and_commented.yaml --epochs 800
#
# EVERY KEY IS OPTIONAL and every key is listed here at its default, so this
# file is the map: copy the two or three lines a run actually changes.
# configs/train.yaml is that short form and is the reference run.
#
# Command-line flags override these values, so one committed config can be
# swept from the shell without editing it.
# =====================================================================

task:
  type: all                     # all | ext2chg | chg2tau; only `all` reaches a total energy
  name: pt_w16_m8_l3            # names models/<name>/ and everything inside it

data:
  # ------------------------------------------------------------------------
  # ONE key names the dataset, and every entry in it has the SAME shape:
  #
  #     <a path listed here>/
  #         <material>/         one subdirectory per structure
  #             CHGCAR          required -- the density, and the grid every
  #                             other field of that material is placed on
  #             TAUCAR          OPTIONAL, and optional per material
  #             POSCAR INCAR    optional; when present the external potential
  #             POTCAR ...      is built from them exactly
  #
  # That is what a VASP run tree looks like, what `poraque-mp` writes, and what
  # the cache builder produces -- so there is nothing to declare about where a
  # path came from, and no key that says so. Paths are pooled into one dataset.
  #
  # What DIFFERS between them is the CONTENT of a material's directory, and
  # content is read, not configured:
  #
  #     inputs beside the density  ->  V_ext computed from them (exact with a
  #                                    POTCAR, or with `potcar_dir` below)
  #     a density on its own       ->  V_ext computed from the structure the
  #                                    CHGCAR carries in its own header
  #
  # V_ext is ALWAYS computed, never read from an EXTCAR that happens to sit in
  # a directory: at inference time there is no DFT run to read one from, so the
  # input channel has to be Poraque's own arithmetic in both places.
  #
  # TAUCAR is optional per material and needs no declaring. A material that has
  # one joins the chg2tau set; one that does not still joins ext2chg and is
  # simply absent from the other. A whole task with no target anywhere is
  # skipped with a message rather than failing the run -- which is what makes
  # `type: all` sensible on a Materials Project download, where no tau exists.
  #
  # A path holding ONE material's run directly -- its files at the top level
  # rather than one level down -- is read as that single material, so a lone
  # calculation needs no wrapper directory.
  # ------------------------------------------------------------------------
  data_paths:                   # null uses data/vasp/structures
    - data/vasp/structures      # local runs:   structure_0000/, structure_0001/, ...
  # - data/MP                   # an MP download: mp-124/, mp-81/, ...  (no TAUCAR)
  # - data/MP                   # (any other dataset root, pooled with the first)
  cache: data/cache             # where the downsampled copies are written
  pattern: ""                   # prefix filter on the material subdirectories. EMPTY takes
                                #   all of them, which is the only sensible default now that
                                #   one key names every kind of dataset: "structure" would
                                #   silently exclude every mp-124/ in a download. Set it to
                                #   skip a sibling folder that must not be trained on; it is
                                #   part of the cache fingerprint.
  format: auto                  # auto | vasp -- the code that wrote the files, and NOTHING
                                #   else. There is no layout to choose: every path is a
                                #   directory of per-material subdirectories, and what a
                                #   material holds is read, not declared.
  resolution: 32                # longest grid axis after spectral downsampling
  potcar_dir: null              # POTCAR library; without one V_ext falls back to the Gaussian model
  strict_potcar: false          # raise instead of falling back when a configured library cannot
                                #   serve an element. What it DID serve is in the cache
                                #   fingerprint either way (`potcar_source`, per element), so a
                                #   cache built while the library was unreachable is rebuilt
                                #   rather than reused -- `potcar_dir` alone records only the
                                #   path that was asked for.
  sigma: null                   # Gaussian pseudo-ion width in Ang; null derives it per species
  gaussian_blur: null           # blur width in Ang for the computed potential
  blur_method: spectral         # spectral | ndimage
  spin: auto                    # auto reads the sources; true demands ISPIN=2, false discards it
  precision: float64            # how the fields are held in memory (not what the model computes in)
  xc: auto                      # pbe | lda | pw91 | auto; read by the EL analysis, not by training
  delta_density: true           # ext2chg learns rho - rho_sup; predict() still returns the full rho
  atomic_reference: data/vasp/isolated_atoms   # atomic_reference.json, or a dir of one-atom runs
  paw_source: atomic            # atomic (free atom, transferable) | material (training-set average)
  storage: files                # files (a CHGCAR-format text file per field) | hdf5 (one fields.h5)
  compression: null             # null | gzip | lzf; hdf5 only, and raises on a text cache
  compression_level: 4          # gzip only; ignored by lzf

  # The largest performance setting in this file, and the one whose effect is
  # invisible from the results: off, EVERY EPOCH re-reads, decompresses and
  # re-parses every field, producing the same numbers ten times slower.
  # Measured on a V100 with 115 structures at 32^3 -- __getitem__ was 59% of
  # the training loop and the GPU sat at 2-4%; turning it on took twenty epochs
  # from 168.0 s to 16.3 s (10.3x) with the validation error identical to five
  # decimals. `auto` estimates the decoded size and enables it under 4 GiB.
  # This is not a CUDA setting: the parse is the same on MPS and CPU.
  cache_in_memory: auto         # auto | true | false

model:
  # width is how much information travels through, modes is how far it travels
  # in space, projection_channels is only how it is read out. Spectral weights
  # go as width^2 * modes^3 and are ~99.8% of the parameters.
  width: 16                     # channels carried through the Fourier layers
  modes: 8                      # retained Fourier modes per axis, counted from the lowest
  n_layers: 3                   # how many times the lift/spectral/project cycle runs
  projection_channels: 64       # hidden width of the read-out head; pointwise, so cheap

  mode_selection: fixed         # fixed keeps `modes` per axis; physical keeps a fixed band
  g_max: null                   # cutoff in 1/Ang, required by mode_selection: physical
  # `physical` is right for a dataset spanning cell sizes; then set
  # modes = floor(g_max * L_max / 2pi) for the LARGEST cell, or the modes no
  # small cell ever reached stay at their random initialisation and go live
  # on a large one.

  activation: silu              # silu | gelu | relu | tanh (stateless) | kan (learned per channel)
  projection_activation: null   # read-out nonlinearity; null follows `activation`
  kan_setup: null               # read ONLY when activation: kan; null means the defaults below
  # kan_setup:
  #   variant: bspline          # bspline (the KAN paper) | cheby | rbf | rational
  #   use_base: true            # keep the w_c*silu(x) base term; false is a "pure" KAN
  #   grid_size: 8              # knot intervals (bspline) / RBF centers - 1 (rbf)
  #   spline_order: 3           # B-spline degree; bspline only
  #   grid_range: [-2.0, 2.0]   # support of that grid; bspline clamps outside it, rbf decays
  #   degree: 6                 # highest Chebyshev order; cheby only
  #   rational_num_degree: 4    # numerator power; rational only
  #   rational_den_degree: 4    # even denominator powers; rational only
  # Cost relative to gelu at width=16 on CPU: cheby 1.36x, rational 1.54x,
  # rbf 2.00x, bspline 5.50x. Every variant starts close to silu.

  use_coordinates: true         # append three fractional-coordinate channels to the input
  cell_conditioning: true       # condition every layer on the lattice through FiLM
  embedding_dim: 32             # width of the cell embedding FiLM reads
  precision: float32            # float32 | float64; what the operator computes in

  pauli_residual: false         # chg2tau: predict tau = tau_vW + s*softplus(f), bound by construction
  pauli_scale: null             # initial Pauli scale in eV/Ang^3; null fits it from the training split
  learn_pauli_scale: true       # optimise that scale alongside the backbone

training:
  epochs: 500                   # passes over the training set
  batch_size: 4                 # samples per batch within one grid-shape bucket
  learning_rate: 0.002
  weight_decay: 0.0001
  optimizer: adamw              # adamw | adam | sgd; identical to adam at weight_decay 0
  scheduler: cosine             # cosine | null
  grad_clip: 1.0                # global gradient-norm clip; 0 disables
  loss: relative_l2             # absolute_l2 | relative_l2 | absolute_h1 | relative_h1
                                #   'relative' divides each sample by its own target norm, so
                                #     every MATERIAL counts equally; 'absolute' does not, so
                                #     every VOXEL does and a dense cell weighs more.
                                #   'h1' adds sobolev_weight * the same error on the spatial
                                #     gradients -- both halves in the SAME norm, so the weight
                                #     is a pure ratio and not also a change of scale.
                                #   The progress table names whichever one is running, and
                                #     early stopping is decided on it.
  sobolev_weight: 0.1           # w_Sob; read only by the two h1 losses
  valid_fraction: 0.2           # held out at the STRUCTURE level; 0 trains on everything
  eval_epoch: 10                # evaluate and log every this many epochs
  early_stopping: 300           # epochs without improvement before stopping; 0 disables
  enable_kfold: false           # cross-validate instead of fitting once; produces K models, not one
  k_folds: 5                    # folds, capped at the number of structures
  seed: 42                      # the validation draw, the fold partition, the batch order
  init_seed: null               # seeds the WEIGHTS only; null reuses `seed`
  device: auto                  # auto (CUDA, then MPS, then CPU) or an explicit backend
  strict_device: false          # abort instead of falling back to the CPU
                                #   Off is right for a workstation: a config written on a
                                #     machine with a GPU should still run on a laptop.
                                #   TRUE IN EVERY HPC JOB. In a queue the fallback is not
                                #     graceful -- the job waits for its GPU, the warning goes
                                #     into a log nobody reads until afterwards, and the run
                                #     trains on the CPU inside the GPU allocation until the
                                #     wall clock ends. `python -m poraque.ml.device --check`
                                #     is the same test for three seconds, before the queue.

  # Multi-GPU. `auto` forms a DistributedDataParallel group over NCCL WHEN THE
  # LAUNCHER ALREADY DESCRIBES ONE -- a Slurm step with several tasks, or
  # torchrun -- and does nothing otherwise. It cannot invent ranks: the launcher
  # decides the topology and this key decides only whether to believe it. So on
  # a cluster the line that matters is in the submission script:
  #     #SBATCH --ntasks-per-node=4   # one task per GPU. Not optional.
  #     #SBATCH --gres=gpu:4
  #     srun poraque-train --config ... --strict-device --distributed auto
  # Requesting four GPUs and launching ONE task is a perfectly good single-GPU
  # run that looks, from inside the process, exactly like the one you asked for
  # -- which is why the run log prints the Slurm variables it saw.
  # `off` runs single-GPU inside a multi-task allocation, which is how a
  # scaling result is bisected. Rank 0 alone prints and writes; the EFFECTIVE
  # BATCH SIZE is batch_size x world_size, so a four-rank run is not the same
  # optimiser as the one-rank run it is compared against.
  # See scripts/slurm/poraque_ddp.sbatch.
  distributed: auto             # auto | off
  distributed_timeout: 30.0     # minutes before a collective is declared failed.
                                #   Long on purpose: the first collective happens after
                                #   every rank has read its cache, and a cold parallel-
                                #   filesystem read of a few hundred densities is minutes.

  # Getting the data to the device. Read data.cache_in_memory first: these two
  # are ALTERNATIVES, not complements. Under `distributed` this gets WORSE, not
  # better -- each rank is already a process with a field cache of its own, and
  # workers on top multiply the copies again. Measured, 20 epochs on 115 structures:
  # the cache alone 168.0 -> 16.3 s, four workers alone -> 120.2 s, and the two
  # together back up to 18.8 s -- each worker is a process that re-parses the
  # whole set into a cache of its own.
  num_workers: 0                # DataLoader worker processes; 0 loads in the main process
  pin_memory: auto              # auto = true on CUDA, false elsewhere (it is a CUDA optimisation)
  tf32: true                    # TensorFloat-32 matmul/conv; CUDA only, and nothing before Ampere

  # There is no `compile:` key. torch.compile was measured on a V100 and
  # removed in 26.9.3: Inductor does not generate code for complex operators,
  # SpectralConv3d's weights are complex, so the one part of an FNO that
  # compilation was invoked to fuse is the part it hands back to eager -- while
  # the wrapper and the graph breaks are still paid for. +7.9% and +9.4% per
  # epoch over two modes and two repetitions, 200-314 s of cold compilation on
  # top, a validation error that moved reproducibly, and on four ranks an
  # eighteen-minute first epoch with no output. Setting the key now raises and
  # says so. See CUDA_4.md.

  # Physics-informed terms for the NEURAL OPERATOR: total = data + sum_i w_i * term_i.
  # Only the total is reported. Introduce one at a time against a measured
  # baseline -- a badly scaled constraint degrades accuracy while looking
  # principled. Not to be confused with symbolic.physics below.
  physics:
    electron_count_weight: 0.0  # ext2chg: int(rho) must equal the known valence count
    positivity_weight: 0.0      # rho, tau >= 0 (a Log head is the better fix)
    von_weizsacker_weight: 0.0  # chg2tau: tau >= |grad rho|^2 / (8 rho), a theorem, one-sided
    euler_lagrange_weight: 0.0  # ext2chg: dTs/drho + v_ext + v_H + v_xc = const, on a surrogate Ts

output:
  root: models                  # parent of every run folder; null writes NOTHING at all
  write_log: true               # log/<name>.log, .json, and the resolved config
  plot_figures: true            # render the figures into plots/
  write_pdf_report: true        # typeset the PDF into report/; needs a LaTeX toolchain
  checkpoint: true              # write the .poraque
  log: null                     # explicit log path; null uses the run folder
  json: null                    # explicit metrics path; null uses the run folder
  plot_format: png
  dpi: 200

symbolic:
  enable_symbolic_distillation: false   # minutes to hours of CPU after the fit, and needs PySR
  target: model                 # model distils what the operator learned; reference fits the DFT data
  features: gga                 # gga (rho, p, q) | reduced (p, q) | raw | enhancement (alias)
  template: none                # none fits tau directly; pauli fits F = (tau - tau_vW)/tau_TF
  # `features: reduced` with `template: pauli` is the orbital-free pairing:
  # every constant to be found is then order unity.
  epsilon: 1.0e-08              # vacuum threshold; p and q there are ratios of two noises
  constraints: {"^": [-1, 1]}   # per-operator argument complexity; the exponent is held to 1
  data_loss: mse                # mse | mae; mae is more robust on a density with wide tails
  unary_operations: [exp, log, sqrt, abs]
  binary_operations: ['+', '-', '*', /, '^']
  iterations: 40                # the single biggest quality/time knob
  population_size: 33
  populations: 15
  max_depth: 10                 # ceilings that keep the result readable rather than
  max_size: 30                  #   a fitted polynomial in disguise
  parsimony: 0.0032             # penalty per node in the fitness
  n_samples: 4000               # voxels sampled across the dataset; cost is linear in them
  seed: 0                       # seeds the sampling always, the search only under `deterministic`
  deterministic: false          # reproducible, at the cost of the parallelism across populations

  # Physics constraints on the SYMBOLIC SEARCH, as fitness rather than as a
  # filter applied afterwards. Note the `loss` column of the reported front is
  # then this constrained objective; R2 and the relative L2 are unaffected.
  physics:
    enable: true
    positivity_weight: 100.0       # F >= 0 on the batch
    thomas_fermi_weight: 100.0     # F(0, 0) = 1, the uniform gas
    von_weizsacker_weight: 100.0   # F(p_inf, 0) = 0, one orbital
    p_infinity: 1.0e+06            # stands in for p -> infinity; keeps p^(8/3) inside float32

fine_tuning:
  enable: false                 # continue a trained fit on a narrower set; normalizations come
                                #   from the checkpoint, never refitted on the new data
  pretrained_checkpoint: models/poraque_models.poraque
  learning_rate: 1.0e-05        # much lower than a fresh fit, which is the point
  freeze_lifting_layers: false  # keep the input embedding fixed and adapt only the operator;
                                #   ignored under use_lora, which freezes everything anyway
  use_lora: false               # LoRA: freeze every trained weight and learn a rank-r
                                #   correction  W' = W + (alpha/r) B A  beside the DENSE
                                #   (1x1x1) lifting and projection convolutions.
                                #   On the shipped model that is 1320 trainable parameters
                                #   against 3152353 frozen -- 0.042% -- and the saved file
                                #   goes from 12.0 MB to 7.6 kB.
                                #   B starts at zero, so the adapted model IS the base model
                                #   until the first step.
                                #   CAVEAT: the spectral weights are NOT adapted, so this
                                #     re-fits how fields enter and leave the operator and
                                #     leaves the operator itself alone. A family whose
                                #     operator genuinely differs needs a full fine-tune.
                                #   The checkpoint holds the ADAPTER ONLY and names its base,
                                #     so it cannot be loaded without that base file.
  lora_rank: 8                  # r; cost and capacity are both linear in it
  lora_alpha: 16.0              # the update is scaled by alpha / r, which keeps a learning
                                #   rate roughly transferable between ranks
  lora_dropout: 0.0             # dropout on the adapter's input
