# CHON references are independent single-atom VASP calculations.
task:
  type: ext2chg
  name: chon_ext2chg
data:
  data_paths: [./data/CHON]
  cache: ./data/cache/chon
  potcar_dir: /Users/leseixas/Simulations/vasp/POTCARs
  strict_potcar: true
  atomic_reference: ./data/CHON/isolated_atoms
  delta_density: true
  resolution: 24
  storage: hdf5
  cache_in_memory: true
model:
  use_coordinates: false
  mode_selection: physical
  g_max: 12
  equivariant:
    enable: true
    n_radial: 8
    g_basis: auto
    spherical_cutoff: true
  paw:
    enable: true
    width: 16
    modes: 6
    n_layers: 3
    readout_g_max: auto
    occupancy_weight: 3
training:
  epochs: 100
  learning_rate: 0.001
  eval_epoch: 5
  early_stopping: 30
  init_seed: 0
output:
  plot_figures: false
  write_pdf_report: false
