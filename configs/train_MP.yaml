# =====================================================================
# Poraque - training on a Materials Project charge-density download
#
#   poraque-train --config configs/train_materialsproject.yaml
#
# configs/train.yaml is the reference run; this file differs from it only
# where the *data* forces it. See configs/train_complete_and_commented.yaml
# for every key, annotated.
# =====================================================================

task:
  type: ext2chg                 # MP publishes densities but no tau, so chg2tau has no target
  name: mp_ag_au_pt             # names models/<name>/ and everything inside it

data:
  data_paths:                   # one entry per dataset root; each holds one subdirectory
                                #   per material. Nothing here says "this is MP data" --
                                #   a download has the same shape as a run tree.
    - data/MP/Pt-Pd-Ni          # mp-124/, mp-81/, ... each with a CHGCAR and no TAUCAR
  resolution: 40                # coarser than the raw grids, finer than the default; the
                                #   downsample is exact for band-limited fields
  potcar_dir: /Users/leseixas/Simulations/vasp/POTCARs   # essential here: an MP download ships
                                #   no pseudopotentials. Use the set the data was computed with
                                #   (MP is PAW_PBE); PAW_LDA would look exact and be wrong

model:
  width: 16                     # channels carried through the Fourier layers
  modes: 8                      # the CEILING on retained modes; g_max only ever selects fewer
  n_layers: 3                   # Fourier layers
  projection_channels: 64       # hidden width of the read-out head
  mode_selection: physical      # this set spans cell sizes, so truncate at a fixed wavevector
                                #   rather than a fixed index: the same physics in every material
  g_max: 16                     # 1/Ang. Keep modes = floor(g_max * L_max / 2pi) for the LARGEST
                                #   cell, or modes no small cell reached stay randomly initialised
  # 16 rather than the 6 this file shipped with until 2026-09-04, and the change is
  # measured rather than tidied. On this very dataset -- 115 MP structures,
  # cells 2.29 to 25.87 Ang -- LNCC ran g_max through 6/9/12/16 at two seeds:
  # 6 STARVED the band and lost 55% against mode_selection: fixed, while 16
  # kept 7.34 modes per axis of the 8 allocated and beat `fixed` by 20% in
  # both seeds, at the same parameter count and the same time per epoch. The
  # useful value moves with resolution and modes (24 was better at 64^3 with
  # modes 24), and too generous collapses the margin, so read the two lines
  # `poraque-train` prints at startup rather than trusting this number.
  activation: silu              # stateless; `kan` moves the hyperparameters into kan_setup

training:
  physics_informed:             # these constrain the NEURAL OPERATOR, not the symbolic search
    enable: auto                # auto: on, because a weight below is non-zero
    electron_count_weight: 0.1  # int(rho) = the known valence count
    positivity_weight: 0.0
    von_weizsacker_weight: 0.0
    euler_lagrange_weight: 0.0
