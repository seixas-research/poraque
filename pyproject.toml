[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poraque"
dynamic = ["version"]
authors = [
  { name="Leandro Seixas Rocha", email="leandro.rocha@ilum.cnpem.br" },
]
description = "For electronic structure calculations"
readme = "README.md"
license = {file = "LICENSE"} # MIT License
requires-python = ">=3.14"
dependencies = [
    'numpy',
    'pandas',
    'ase',
    'scipy',
    'matplotlib',
    'pytest'
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
# CPU acceleration: the Numba JIT / OpenMP kernels in poraque.accel and the
# tests/test_jit.py suite. Numba 0.65 fails to import against NumPy >= 2.5, so
# the upper bound is pinned alongside Numba here (it is only needed when Numba
# is installed; the core package keeps NumPy unconstrained and falls back to a
# pure-NumPy implementation when Numba is absent).
accel = [
    'numba>=0.60',
    'numpy<2.5',
]
# Exchange-correlation GGA functionals (PBE / PBEsol) are backed by libxc via
# its 'pylibxc' bindings. These are distributed through conda-forge, NOT PyPI,
# so they cannot be declared as pip dependencies; install them with:
#   conda install -c conda-forge libxc pylibxc

[project.urls]
"Homepage" = "https://github.com/seixas-research/poraque"

[tool.hatch.version]
path = "src/poraque/version.py"

