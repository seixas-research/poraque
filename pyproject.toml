[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poraque"
dynamic = ["version"]
authors = [
  { name="Leandro Seixas Rocha", email="leandro.rocha@ilum.cnpem.br" },
]
description = "For machine learning density-based operators"
readme = "README.md"
license = {file = "LICENSE"} # MIT License
requires-python = ">=3.11"
dependencies = [
    'numpy',
    'ase',
    'scipy',
    'matplotlib',
    'pytest',
    'torch>=2.0',
    'pyyaml',
    'mp-api',
    'python-dotenv',
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
#   pip install -e ".[symbolic]"
symbolic = [
    'pysr>=1.0',
    'sympy',
]

[project.urls]
"Homepage" = "https://github.com/seixas-research/poraque"

[project.scripts]
poraque-train = "poraque_train:main"
poraque-inference = "poraque_inference:main"
poraque-committee = "poraque_committee:main"
poraque-active-learning = "poraque_active_learning:main"
poraque-atoms = "poraque_atoms:main"
poraque-vasp = "poraque_vasp:main"
poraque-mp = "poraque.data.materials_project:main"

[tool.hatch.build.targets.wheel]
sources = ["src", "scripts"]
only-include = [
    "src/poraque",
    "scripts/poraque_train.py",
    "scripts/poraque_inference.py",
    "scripts/poraque_committee.py",
    "scripts/poraque_active_learning.py",
    "scripts/poraque_atoms.py",
    "scripts/poraque_vasp.py",
]

# The C kernel ships as *source* and is compiled on first use into a user
# cache (see poraque.ml.backend). Shipping the .c rather than a built object
# keeps the wheel pure-Python and platform-independent, and costs one ~1 s
# compile the first time a CPU inference runs. Without this rule hatchling
# would install only the .py files and the backend could never be built.
[tool.hatch.build.targets.wheel.force-include]
"src/poraque/ml/_spectral.c" = "poraque/ml/_spectral.c"

[tool.hatch.version]
path = "src/poraque/version.py"

