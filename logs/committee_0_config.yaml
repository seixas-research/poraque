task: ext2chg
data:
  root: data/vasp
  cache: data/cache
  pattern: struct
  code: auto
  resolution: 32
  gaussian_blur: null
  blur_method: spectral
model:
  width: 16
  modes: 8
  n_layers: 4
  projection_channels: 48
  activation: gelu
  use_coordinates: true
  cell_conditioning: true
  embedding_dim: 32
  mode_selection: fixed
  g_max: null
  pauli_residual: false
  pauli_scale: null
  learn_pauli_scale: true
training:
  epochs: 200
  batch_size: 4
  learning_rate: 0.002
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
  valid_fraction: 0.0
  enable_kfold: false
  k_folds: 5
  eval_epoch: 10
  early_stopping: 50
  seed: 0
  init_seed: 0
  device: auto
  loss: relative_l2
  sobolev_weight: 0.1
  physics:
    electron_count_weight: 0.0
    positivity_weight: 0.0
    von_weizsacker_weight: 0.0
    euler_lagrange_weight: 0.0
output:
  log: logs/committee_0.log
  json: logs/committee_0.json
  checkpoint_dir: models/committee_0
  plot_dir: null
  report_dir: ''
  plot_format: png
  dpi: 160
