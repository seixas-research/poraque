task: all
data:
  root: data/vasp
  cache: data/cache
  pattern: struct
  code: auto
  resolution: 32
  train_fraction: 0.8
  split: leave_one_out
  seed: 0
  use_vasp_extcar: false
  gaussian_blur: null
  blur_method: spectral
model:
  width: 16
  modes: 8
  n_layers: 4
  projection_channels: 48
  activation: gelu
  use_coordinates: true
  cell_conditioning: true
  embedding_dim: 32
  mode_selection: fixed
  g_max: null
  pauli_residual: false
  pauli_scale: null
  learn_pauli_scale: true
training:
  epochs: 200
  batch_size: 4
  learning_rate: 0.002
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
  mode: universal
  holdout: null
  enable_kfold: true
  k_folds: 5
  seed: 0
  device: auto
  loss: relative_l2
  sobolev_weight: 0.1
  physics:
    electron_count_weight: 0.0
    positivity_weight: 0.0
    von_weizsacker_weight: 0.0
    euler_lagrange_weight: 0.0
output:
  log: logs/kfold.log
  json: logs/kfold.json
  checkpoint_dir: ''
  plot_dir: results/plots/kfold
  report_dir: reports
  plot_format: png
  dpi: 160
