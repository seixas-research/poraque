task: ext2chg
data:
  root: data/vasp
  cache: data/cache
  pattern: struct
  code: auto
  resolution: 20
  train_fraction: 0.8
  split: leave_one_out
  seed: 0
  use_vasp_extcar: false
  gaussian_blur: null
  blur_method: spectral
model:
  width: 8
  modes: 4
  n_layers: 2
  projection_channels: 16
  activation: gelu
  use_coordinates: true
  cell_conditioning: true
  embedding_dim: 32
  mode_selection: fixed
  g_max: null
  pauli_residual: false
  pauli_scale: null
  learn_pauli_scale: true
training:
  epochs: 6
  batch_size: 4
  learning_rate: 0.002
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
  mode: universal
  holdout: null
  seed: 0
  device: auto
  loss: relative_l2
  sobolev_weight: 0.1
  physics:
    electron_count_weight: 0.0
    positivity_weight: 0.0
    von_weizsacker_weight: 0.0
    euler_lagrange_weight: 0.0
output:
  log: logs/smoke.log
  json: logs/smoke.json
  checkpoint_dir: /tmp/smokemodels
  plot_dir: /tmp/smokeplots
  plot_format: png
  dpi: 160
