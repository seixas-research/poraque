task: all
data:
  train_paths:
  - data/MP
  root: data/vasp
  source: auto
  cache: data/cache/mp
  pattern: struct
  code: auto
  resolution: 32
  sigma: null
  gaussian_blur: null
  blur_method: spectral
  spin: auto
model:
  width: 16
  modes: 8
  n_layers: 4
  projection_channels: 48
  activation: gelu
  use_coordinates: true
  cell_conditioning: true
  embedding_dim: 32
  mode_selection: fixed
  g_max: null
  pauli_residual: false
  pauli_scale: null
  learn_pauli_scale: true
training:
  epochs: 10
  batch_size: 4
  learning_rate: 0.002
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
  valid_fraction: 0.2
  enable_kfold: false
  k_folds: 5
  eval_epoch: 5
  early_stopping: 50
  seed: 42
  init_seed: null
  device: auto
  loss: relative_l2
  sobolev_weight: 0.1
  physics:
    electron_count_weight: 0.0
    positivity_weight: 0.0
    von_weizsacker_weight: 0.0
    euler_lagrange_weight: 0.0
output:
  log: logs/mp_training.log
  json: logs/mp_training.json
  checkpoint_dir: models/mp
  plot_dir: results/plots/mp
  report_dir: reports/mp
  plot_format: png
  dpi: 160
symbolic:
  enable_symbolic_distillation: false
  target: model
  features: gga
  template: none
  epsilon: 1.0e-08
  constraints:
    ^:
    - -1
    - 1
  unary_operations:
  - exp
  - log
  - sqrt
  - abs
  binary_operations:
  - +
  - '-'
  - '*'
  - /
  - ^
  iterations: 40
  population_size: 33
  populations: 15
  max_depth: 10
  max_size: 30
  parsimony: 0.0032
  n_samples: 4000
  seed: 0
  deterministic: false
fine_tuning:
  enable: false
  pretrained_checkpoint: models/poraque_models.pfno
  learning_rate: 1.0e-05
  freeze_lifting_layers: false
